name: build

on:
  # Automatic builds are limited to files that can change the produced JARs.
  # CI and release workflow changes can still be verified with workflow_dispatch.
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'versions/**'
      - 'fabricWrapper/src/**'
      - 'fabricWrapper/build.gradle.kts'
      - 'fabricWrapper/gradle.properties'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'versions/**'
      - 'fabricWrapper/src/**'
      - 'fabricWrapper/build.gradle.kts'
      - 'fabricWrapper/gradle.properties'
      - 'buildSrc/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:
    inputs:
      validation:
        description: Test scope (all versions are always compiled and packaged)
        type: choice
        default: full
        options:
          - full
          - main

env:
  IS_THIS_RELEASE: false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Java 25 warns when legacy Guava/JOML code uses Unsafe during remapping.
  # This is a third-party compatibility path, not Printer code.
  GRADLE_OPTS: --sun-misc-unsafe-memory-access=allow

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          # Hosted Ubuntu runners already cache Temurin; avoid downloading a second JDK.
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Loom's Minecraft archives belong to the dependency-keyed cache below,
          # not the Gradle User Home entry saved for every new commit.
          gradle-home-cache-excludes: caches/fabric-loom

      - name: Cache Loom dependencies and workspace
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches/fabric-loom
            ./.gradle/loom-cache
            ./libs
          key: ${{ runner.os }}-${{ runner.arch }}-loom-v2-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', '**/gradle.properties', 'buildSrc/src/**', 'versions/mainProject', 'versions/mapping-*.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-loom-v2-

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build fabricWrapper subproject
        shell: bash
        env:
          CI_VALIDATION: ${{ github.event_name == 'push' && 'main' || inputs.validation || 'full' }}
        run: >-
          ./gradlew :fabricWrapper:build -x jacocoTestCoverageVerification
          --init-script .github/scripts/ci-build.init.gradle "-PciValidation=$CI_VALIDATION"
          --stacktrace --console=plain --profile

      - name: Capture Gradle timing report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gradle-profile
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

      - name: Delete wrapper sources jar
        run: |
          find fabricWrapper/build/libs/ -name "*-sources.jar" -delete

      - name: Capture versionpack
        uses: actions/upload-artifact@v7
        with:
          name: versionpack
          path: fabricWrapper/build/libs/*.jar
          if-no-files-found: error
          retention-days: 1
          archive: false

      - name: Capture standalone version JARs
        uses: actions/upload-artifact@v7
        with:
          name: version-jars
          path: fabricWrapper/build/libs/jars/
          if-no-files-found: error
          retention-days: 1

      - name: Publish development build to Modrinth
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master' &&
          github.repository == 'Yur1Ca/litematica-printer'
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_VERSION_TYPE: alpha
          MODRINTH_COMMIT_SHA: ${{ github.sha }}
          MODRINTH_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/publish-modrinth.sh
