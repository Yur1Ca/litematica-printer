name: release

on:
  workflow_dispatch:
    inputs:
      target_release_tag:
        description: Existing or new GitHub release tag
        type: string
        required: true

env:
  IS_THIS_RELEASE: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Java 25 warns when legacy Guava/JOML code uses Unsafe during remapping.
  # This is a third-party compatibility path, not Printer code.
  GRADLE_OPTS: --sun-misc-unsafe-memory-access=allow

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.target_release_tag }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./.gradle
            ./libs
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', '**/gradle.properties', 'buildSrc/**') }}
          restore-keys: |
            ${{ runner.os }}-gradle-release-
            ${{ runner.os }}-gradle-

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build all supported versions and wrapper
        shell: bash
        run: |
          ./gradlew :fabricWrapper:build --stacktrace

      - name: Collect release jars
        shell: bash
        run: |
          rm -rf release-artifacts
          mkdir -p release-artifacts/version-jars

          find fabricWrapper/build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" -exec cp {} release-artifacts/ \;
          find fabricWrapper/build/libs/jars -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" -exec cp {} release-artifacts/version-jars/ \;

          find release-artifacts -type f -name "*.jar" -print | sort

      - name: Upload jars to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.target_release_tag }}
          files: release-artifacts/**/*.jar
          generate_release_notes: true
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish beta wrapper to Modrinth
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_FILE_DIR: release-artifacts
          MODRINTH_VERSION_TYPE: beta
          MODRINTH_CHANGELOG: |
            Beta release `${{ inputs.target_release_tag }}`.

            [View GitHub release](https://github.com/${{ github.repository }}/releases/tag/${{ inputs.target_release_tag }})
        run: bash .github/scripts/publish-modrinth.sh
