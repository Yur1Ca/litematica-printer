name: release

on:
  workflow_dispatch:
    inputs:
      target_release_tag:
        description: Existing or new GitHub release tag
        type: string
        required: true

env:
  IS_THIS_RELEASE: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Allow the Unsafe access used by test fixtures and third-party libraries on Java 25.
  GRADLE_OPTS: --sun-misc-unsafe-memory-access=allow

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.target_release_tag }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          # Keep Minecraft archives in the shared, version-filtered cache below.
          gradle-home-cache-excludes: caches/fabric-loom

      - name: Cache Loom dependencies and workspace
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches/fabric-loom/26.*
            ~/.gradle/caches/fabric-loom/*.json
            ~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft/*/26.*
            ./.gradle/loom-cache/minecraftMaven/net/minecraft/*/26.*
            ./libs
          # Share the build workflow's cache, without inheriting its legacy bundle.
          key: ${{ runner.os }}-${{ runner.arch }}-loom-26-v3-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'build.fabric.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'versions/*/gradle.properties', 'versions/mainProject') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-loom-26-v3-

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build all supported versions and wrapper
        shell: bash
        run: |
          ./gradlew :fabricWrapper:build --no-parallel --max-workers=2 --stacktrace --console=plain --profile

      - name: Capture Gradle timing report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: gradle-profile
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect release jars
        shell: bash
        run: |
          rm -rf release-artifacts
          mkdir -p release-artifacts/version-jars

          find fabricWrapper/build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" -exec cp {} release-artifacts/ \;
          find fabricWrapper/build/libs/jars -maxdepth 1 -type f -name "*.jar" ! -name "*-sources.jar" -exec cp {} release-artifacts/version-jars/ \;

          find release-artifacts -type f -name "*.jar" -print | sort

      - name: Upload jars to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.target_release_tag }}
          files: release-artifacts/**/*.jar
          generate_release_notes: true
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish beta wrapper to Modrinth
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_FILE_DIR: release-artifacts
          MODRINTH_VERSION_TYPE: beta
          MODRINTH_CHANGELOG: |
            Beta release `${{ inputs.target_release_tag }}`.

            [View GitHub release](https://github.com/${{ github.repository }}/releases/tag/${{ inputs.target_release_tag }})
        run: bash .github/scripts/publish-modrinth.sh
